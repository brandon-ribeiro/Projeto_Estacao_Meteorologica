<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Dashboard</title>
</head>
<body>
    <header>
        <a class="header-logo" href="#home">
            <img class="logo" src="assets/clima.png" alt="logo_meteorologia">
            <div>
                <h1>Estação Meteorológica</h1>
                <p>Monitoramento em tempo real</p>
            </div>
        </a>
        <div class="header-status">
            <div class="status-bolinha" id="statusBolinha"></div>
            <div>
                <p class="title" id="local">Estação</p>
                <p class="status" id="statusHeader">--</p>
            </div>
        </div>
    </header>
    <main>
        <div class="topo">
            <h2 class="titulo-pagina" id="tituloPagina">Home</h2>
            <div class="filtro">
                <button class="filtro-botao" id="filtroBotao" type="button" aria-label="Filtrar componentes" aria-expanded="false">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
                        <path d="M3 4h18l-7 8.5V19l-4 2v-8.5z"/>
                    </svg>
                </button>
                <ul class="filtro-menu" id="filtroMenu">
                    <li><a href="#home">Todos</a></li>
                    <li><a href="#dht22">DHT22</a></li>
                    <li><a href="#mq135">MQ135</a></li>
                    <li><a href="#bmp280">BMP280</a></li>
                    <li><a href="#ldr">LDR</a></li>
                </ul>
            </div>
        </div>

        <p class="erro-dados" id="erroDados"></p>

        <section class="pagina" id="paginaHome"></section>

        <section class="pagina" id="paginaDetalhe" hidden>
            <h3 class="secao-titulo">Especificações</h3>
            <div class="spec-card">
                <div class="spec-componente">
                    <img class="spec-img" id="specImg" src="" alt="">
                    <p class="spec-nome" id="specNome">--</p>
                    <p class="spec-tensao" id="specTensao">--</p>
                    <p class="spec-descricao" id="specDescricao"></p>
                </div>
                <dl class="spec-medidas" id="specMedidas"></dl>
            </div>

            <h3 class="secao-titulo">Gráfico - Histórico de medições</h3>
            <div class="grafico-card">
                <div class="grafico-legenda" id="graficoLegenda"></div>
                <div class="grafico" id="grafico"></div>
            </div>
        </section>
    </main>
    <footer>
        <p class="footer-titulo">Estação Meteorológica &bull; 2026</p>
        <p class="footer-nomes">Brandon &bull; Matheus &bull; Pedro &bull; Ricardo</p>
    </footer>
    <script src="js/lib/jquery-3.7.1.min.js"></script>
    <script src="js/lib/jquery.flot.min.js"></script>
    <script src="js/scripts.js"></script>
</body>
</html>
